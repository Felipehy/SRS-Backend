spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
  mail:
    host: ${SMTP_SERVER}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  glpi:
    full-session-url: ${SPRING_FOREIGN_API_GLPI_GET_FULL_SESSION}
    authorization: ${SPRING_FOREIGN_API_AUTHORIZATION}
    app-token: ${SPRING_FOREIGN_API_GLPI_APP_TOKEN}
    uri: ${GLPI_API_URL}
  url: ${APP_FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    sender:
    frota: ${MAIL_FLEET_ADDRESS}
    reserva: ${MAIL_RESERVATION_ADDRESS}
